<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4E">
<title>Polisportiva Vico · Registro presenze</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--navy:#1B2A4E;--coral:#E8453C;--bg:#EEF1F8;--surf:#fff;--surf2:#F6F8FC;--ink:#14203D;--mute:#64708C;--line:#DCE2EF;--ok:#10b981;--ko:#f43f5e;--glass:rgba(255,255,255,.78)}
.dark{--bg:#0B1226;--surf:#141E38;--surf2:#1B2746;--ink:#EAF0FF;--mute:#93A0C0;--line:#26335A;--glass:rgba(11,18,38,.78)}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:background .2s,color .2s}
.surf{background:var(--surf);border:1px solid var(--line)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.btn{transition:all .2s;border-radius:.75rem;font-weight:700}.btn:active{transform:scale(.95)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--c) 16%,var(--surf));color:color-mix(in srgb,var(--c) 70%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pill-n{background:var(--surf2);color:var(--mute);border:1px solid var(--line)}
.kid{border-radius:1rem;border-left:4px solid var(--line);transition:all .2s}
.kid.presente{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surf))}
.kid.assente{border-left-color:var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--surf))}
.kid.barrato{border-left-color:#94a3b8;background:var(--surf2);opacity:.72}
.kid.barrato .nm{text-decoration:line-through;text-decoration-thickness:2px}
.av{width:3rem;height:3rem;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--c);flex:none;box-shadow:0 4px 10px -3px var(--c)}
.act{flex:1;padding:.8rem .5rem;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.4rem;background:var(--surf2);border:1.5px solid var(--line);color:var(--mute)}
.act.on-p{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 14px -6px var(--ok)}
.act.on-a{background:var(--ko);border-color:var(--ko);color:#fff;box-shadow:0 6px 14px -6px var(--ko)}
.act[disabled]{opacity:.45;cursor:not-allowed}
.chip{white-space:nowrap;padding:.5rem .9rem;font-size:.82rem;border:1px solid var(--line);background:var(--surf);color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dark .chip.on{background:var(--coral);border-color:var(--coral)}
.hero{background:linear-gradient(135deg,var(--navy),#27396b);color:#fff;border-radius:1.5rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:999px;border:26px solid rgba(232,69,60,.9);opacity:.9}
.bar{height:.6rem;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff7a6e,var(--coral));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mini{border-radius:1rem;padding:.65rem .4rem;text-align:center}.mini b{display:block;font-size:1.45rem;line-height:1.1}.mini span{font-size:.68rem;font-weight:700;opacity:.85}
.menu{position:absolute;right:0;top:110%;min-width:16.5rem;border-radius:1rem;padding:.4rem;z-index:60;box-shadow:0 20px 40px -12px rgba(10,20,50,.35)}
.mi{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.6rem .75rem;border-radius:.7rem;font-weight:600;font-size:.9rem}.mi:hover,.mi.on{background:var(--surf2)}
.inp{width:100%;padding:.7rem .9rem;border-radius:.75rem;background:var(--surf2);border:1.5px solid var(--line);color:var(--ink);outline:none;transition:border .2s}.inp:focus{border-color:var(--coral)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:.75rem 1.2rem;border-radius:999px;font-weight:600;font-size:.88rem;transition:all .3s;z-index:100;pointer-events:none;max-width:92vw}.toast.show{opacity:1;transform:translate(-50%,0)}
.blk{background:color-mix(in srgb,var(--c) 20%,var(--surf));border-left:4px solid var(--c);border-radius:.5rem;padding:.35rem .5rem;font-size:.74rem;font-weight:700;line-height:1.2}
.blk.free{background:color-mix(in srgb,#22c55e 16%,var(--surf));border-left-color:#22c55e;border-style:dashed;border-left-style:solid}
.tt th,.tt td{padding:.25rem;border-bottom:1px solid var(--line);min-width:7.2rem;vertical-align:top}.tt th:first-child,.tt td:first-child{position:sticky;left:0;background:var(--surf);min-width:3.4rem;z-index:2;font-weight:700;color:var(--mute);font-size:.75rem}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.loginbg{background:var(--navy);position:relative;overflow:hidden}.loginbg:before{content:"";position:absolute;width:520px;height:520px;border-radius:999px;border:70px solid var(--coral);right:-200px;top:-180px;opacity:.95}.loginbg:after{content:"";position:absolute;width:380px;height:380px;border-radius:999px;border:48px solid #2d4180;left:-170px;bottom:-150px}
.scroll-x{overflow-x:auto;scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
</style>
</head>
<body class="min-h-screen" style="padding-top:env(safe-area-inset-top)">

<!-- LOGIN -->
<section id="login" class="loginbg min-h-screen hidden items-center justify-center p-5">
  <div class="surf relative z-10 w-full max-w-sm rounded-3xl p-7 fade" style="box-shadow:0 30px 60px -20px rgba(0,0,0,.5)">
    <img data-logo alt="CSM Vico 4" class="w-40 mx-auto rounded-2xl" style="background:#fff">
    <h1 class="text-2xl font-extrabold text-center mt-3">Polisportiva Vico</h1>
    <p class="text-center text-sm mb-5" style="color:var(--mute)">Registro presenze · accedi per continuare</p>
    <button id="gBtn" class="btn w-full py-3 flex items-center justify-center gap-2 surf"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Accedi con Google</button>
    <div class="flex items-center gap-3 my-4 text-xs" style="color:var(--mute)"><i class="flex-1 h-px" style="background:var(--line)"></i>oppure<i class="flex-1 h-px" style="background:var(--line)"></i></div>
    <input id="lEmail" type="email" autocomplete="email" placeholder="Email" class="inp mb-2">
    <input id="lPass" type="password" autocomplete="current-password" placeholder="Password (min. 6 caratteri)" class="inp mb-3">
    <p id="lErr" class="text-sm mb-2 hidden" style="color:var(--coral)"></p>
    <div class="flex gap-2"><button id="lIn" class="btn flex-1 py-3 text-white" style="background:var(--coral)">Accedi</button><button id="lReg" class="btn flex-1 py-3 surf">Crea account</button></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center gap-3">
      <img data-logo alt="" class="h-11 w-11 rounded-xl object-contain" style="background:#fff;border:1px solid var(--line)">
      <div class="min-w-0 flex-1"><div class="font-extrabold leading-tight truncate">Polisportiva Vico</div><div class="text-xs font-semibold" style="color:var(--mute)">CSM Vico 4 · registro presenze</div></div>
      <span id="admBadge" class="hidden text-xs font-extrabold px-2.5 py-1 rounded-full" style="background:linear-gradient(135deg,#f5c542,#e0962a);color:#3a2500">★ Admin</span>
      <button id="dmBtn" class="btn p-2.5 surf" aria-label="Tema chiaro/scuro"></button>
      <div class="relative"><button id="menuBtn" class="btn p-2.5 surf" aria-label="Menu"></button><div id="menu" class="menu surf hidden"></div></div>
    </div>
    <div id="chips" class="scroll-x max-w-3xl mx-auto px-4 pb-2.5 flex gap-2"></div>
  </header>
  <main id="main" class="max-w-3xl mx-auto px-4 py-4 pb-28"></main>
</div>
<div id="modal" class="fixed inset-0 z-[90] hidden items-end sm:items-center justify-center p-3" style="background:rgba(8,14,34,.6)"></div>
<div id="toast" class="toast"></div>

    if(!sn.size&&S.admin&&!S.seeded){S.seeded=true;seed().then(()=>toast('Caricati i 119 bambini dal file Excel'))}

});

/* ---------- DATI ---------- */
async function seed(){
  const b=writeBatch(db);
  DATA.kids.forEach(([g,n,s,c,t])=>{const id=kidId(g,n);b.set(doc(db,'bambini',id),{nome:n,sport:s,classe:c,giorno:g},{merge:true});b.set(doc(db,'contatti',id),{tel:t},{merge:true})});
  await b.commit();
}
async function mark(id,stato){
  const key=S.date+'_'+id,cur=S.pres[key];
  if(cur==='barrato'&&!S.admin)return;
  if(stato==='barrato'&&!S.admin)return;
  try{if(cur===stato)await deleteDoc(doc(db,'presenze',key));else await setDoc(doc(db,'presenze',key),{date:S.date,kidId:id,stato,by:S.user.email,ts:serverTimestamp()})}
  catch(e){toast('Non salvato: '+(e.code||e.message))}
}

const dayName=()=>DAYS[parse(S.date).getDay()];
const isWE=()=>{const d=parse(S.date).getDay();return d===0||d===6};
function shift(n){let d=parse(S.date);do{d.setDate(d.getDate()+n)}while(d.getDay()===0||d.getDay()===6);S.date=iso(d);render()}
function goDay(n){const d=parse(S.date);d.setDate(d.getDate()+n);S.date=iso(d);render()}
function dayKids(){return S.kids.filter(k=>k.giorno===dayName()&&(S.view==='all'||k.sport===S.view)).sort((a,b)=>a.nome.localeCompare(b.nome,'it'))}
const st=k=>S.pres[S.date+'_'+k.id]||'';
function counts(l){const c={tot:l.length,p:0,a:0,b:0};l.forEach(k=>{const s=st(k);if(s==='presente')c.p++;else if(s==='assente')c.a++;else if(s==='barrato')c.b++});return c}

  $('#chips').innerHTML=items.map(([k,l])=>`<button data-v="${k}" class="btn chip rounded-full ${S.view===k?'on':''}">${l}</button>`).join('');
  $('#menu').innerHTML=`<div class="px-3 py-2 text-xs font-bold" style="color:var(--mute)">${esc(S.user?.email||'')}</div>`+
   items.map(([k,l])=>`<button class="mi ${S.view===k?'on':''}" data-v="${k}">${l}${k==='all'?' sport':''}</button>`).join('')+
   `<button class="mi ${S.view==='stats'?'on':''}" data-v="stats">${ic('chart',18)} Statistiche &amp; media presenze</button>`+
   (S.admin?`<div class="my-1 h-px" style="background:var(--line)"></div><button class="mi ${S.view==='board'?'on':''}" data-v="board">${ic('grid',18)} 🔒 Tabellone palestre 26/27 &amp; Originale</button><button class="mi" id="syncBtn">${ic('sync',18)} Sincronizza dati da Excel</button><button class="mi" id="addBtn">${ic('plus',18)} Aggiungi bambino</button>`:'')+
   `<div class="my-1 h-px" style="background:var(--line)"></div><button class="mi" id="outBtn">${ic('out',18)} Esci</button>`;
}
function render(){
  renderChips();
  const m=$('#main');
  charts.forEach(c=>c.destroy());charts=[];
  if(S.view==='stats')return renderStats(m);
  if(S.view==='board'&&S.admin)return renderBoard(m);
  const d=parse(S.date),today=iso(new Date());
  const wk=[];const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);wk.push(x)}
  m.innerHTML=`
  <div class="hero p-5 mb-4 fade"><div class="relative z-10">
    <div class="text-sm font-semibold opacity-80" id="vlab"></div>
    <div class="text-3xl font-extrabold leading-tight mt-0.5">${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</div>
    <div class="text-sm opacity-75 mb-3">${d.getFullYear()}${S.date===today?' · oggi':''}</div>
    <div class="flex items-center gap-2 mb-3">
      <button id="prev" class="btn p-2.5" style="background:rgba(255,255,255,.14)" aria-label="Giorno precedente">${ic('l')}</button>
      <button id="today" class="btn px-4 py-2.5 text-sm" style="background:var(--coral)">Oggi</button>
      <input id="dpick" type="date" value="${S.date}" class="btn px-3 py-2 text-sm flex-1 min-w-0" style="background:rgba(255,255,255,.14);color:#fff;color-scheme:dark">
      <button id="next" class="btn p-2.5" style="background:rgba(255,255,255,.14)" aria-label="Giorno successivo">${ic('r')}</button>
    </div>
    <div class="flex gap-1.5">${wk.map(x=>`<button data-d="${iso(x)}" class="btn flex-1 py-1.5 text-xs" style="background:${iso(x)===S.date?'#fff':'rgba(255,255,255,.12)'};color:${iso(x)===S.date?'var(--navy)':'#fff'}">${DAYS[x.getDay()].slice(0,3)}<br><b class="text-sm">${x.getDate()}</b></button>`).join('')}</div>
    ${isWE()?'':`<div id="sum"></div>`}
  </div></div>
  ${isWE()?`<div class="surf rounded-2xl p-6 text-center fade"><div class="text-4xl mb-2">🌴</div><div class="font-extrabold text-lg">Oggi è ${DAYS[d.getDay()].toLowerCase()}: niente appello!</div><p class="text-sm mb-4" style="color:var(--mute)">Il registro copre da lunedì a venerdì.</p><div class="flex gap-2 justify-center"><button id="gofri" class="btn px-4 py-2.5 surf">Vedi venerdì</button><button id="gomon" class="btn px-4 py-2.5 text-white" style="background:var(--navy)">Vedi lunedì</button></div></div>`:`
  <div id="tools"></div><div id="list" class="space-y-3"></div>`}`;
  $('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
  $('#today').onclick=()=>{S.date=iso(new Date());render()};
  $('#dpick').onchange=e=>{if(e.target.value){S.date=e.target.value;render()}};
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.date=b.dataset.d;render()});
  if(isWE()){$('#gofri').onclick=()=>{const x=parse(S.date);x.setDate(x.getDate()-(x.getDay()===6?1:2));S.date=iso(x);render()};$('#gomon').onclick=()=>{const x=parse(S.date);x.setDate(x.getDate()+(x.getDay()===6?2:1));S.date=iso(x);render()};return}
  const l=dayKids(),c=counts(l),eff=c.tot-c.b,pr=eff?Math.round((c.p+c.a)/eff*100):0;
  $('#vlab').textContent=S.view==='all'?'Tutti gli sport':SPORT[S.view].e+' '+S.view;
  $('#sum').innerHTML=`<div class="grid grid-cols-4 gap-2 mb-3"><div class="mini" style="background:rgba(255,255,255,.14)"><b>${c.tot}</b><span>Previsti</span></div><div class="mini" style="background:rgba(16,185,129,.35)"><b>${c.p}</b><span>✅ Presenti</span></div><div class="mini" style="background:rgba(244,63,94,.35)"><b>${c.a}</b><span>❌ Assenti</span></div><div class="mini" style="background:rgba(148,163,184,.3)"><b>${c.b}</b><span>🚫 Non c'è</span></div></div><div class="flex justify-between text-xs font-bold mb-1"><span>Appello completato</span><span>${pr}%</span></div><div class="bar"><i style="width:${pr}%"></i></div>`;
  $('#tools').innerHTML=`<div class="relative mb-3">
    <span class="absolute left-3.5 top-3.5" style="color:var(--mute)">${ic('search',18)}</span><input id="q" value="${esc(S.q)}" placeholder="Cerca per nome o classe…" class="inp" style="padding-left:2.6rem">
  </div>
  <div class="scroll-x flex gap-2 mb-3">${[['tutti','Tutti'],['da','Da segnare'],['presente','Presenti'],['assente','Assenti']].map(([k,t])=>`<button data-f="${k}" class="btn chip rounded-full ${S.flt===k?'on':''}">${t}</button>`).join('')}</div>
  <div class="flex gap-2 mb-4"><button id="wa" class="btn flex-1 py-3 text-white flex items-center justify-center gap-2" style="background:#25a244">${ic('wa',18)} Invia Riepilogo WhatsApp</button><button id="cp" class="btn px-4 surf" aria-label="Copia riepilogo">${ic('copy',18)}</button></div>`;
  $('#q').oninput=e=>{S.q=e.target.value;renderList()};
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.flt=b.dataset.f;render()});
  $('#wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(summary()),'_blank');
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(summary());toast('Riepilogo copiato negli appunti')}catch(e){toast('Copia non riuscita')}};
  renderList();
}
function renderList(){
  let l=dayKids();const q=S.q.trim().toLowerCase();
  if(q)l=l.filter(k=>(k.nome+' '+k.classe).toLowerCase().includes(q));
  if(S.flt==='da')l=l.filter(k=>!st(k));else if(S.flt==='presente'||S.flt==='assente')l=l.filter(k=>st(k)===S.flt);
  const box=$('#list');
  if(!S.loaded){box.innerHTML=`<div class="text-center p-8" style="color:var(--mute)">Caricamento…</div>`;return}
  if(!l.length){box.innerHTML=`<div class="surf rounded-2xl p-8 text-center"><div class="text-3xl mb-1">🔎</div><div class="font-bold">Nessun bambino da mostrare</div><p class="text-sm" style="color:var(--mute)">${S.kids.length?'Cambia filtro, sport o giorno.':'Non ci sono ancora bambini: un Admin deve usare "Sincronizza dati da Excel".'}</p></div>`;return}
  box.innerHTML=l.map(k=>{
    const s=st(k),sp=SPORT[k.sport]||SPORT['Da assegnare'],lock=s==='barrato'&&!S.admin,ini=k.nome.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),tel=S.tel[k.id];
    return `<article class="kid surf p-3.5 ${s}" style="--c:${sp.c}">
     <div class="flex items-center gap-3"><div class="av">${esc(ini)}</div>
      <div class="min-w-0 flex-1"><div class="nm font-bold text-base leading-tight">${esc(k.nome)}</div>
       <div class="flex flex-wrap gap-1.5 mt-1"><span class="pill">${sp.e} ${esc(k.sport)}</span>${k.classe?`<span class="pill pill-n">${esc(k.classe)}</span>`:''}</div></div>
      ${S.admin?`<button data-edit="${k.id}" class="btn p-2 surf" aria-label="Modifica">${ic('edit',16)}</button>`:''}</div>
     ${s==='barrato'?`<div class="mt-2 text-sm font-bold" style="color:var(--mute)">🚫 Assenza preavvisata oggi</div>`:''}
     ${S.admin&&tel?`<a href="tel:${esc(tel)}" class="btn mt-2.5 flex items-center justify-center gap-2 py-2.5 text-sm surf" style="color:var(--coral)">${ic('phone',16)} Chiama Genitore · ${esc(tel)}</a>`:''}
     <div class="flex gap-2 mt-3">
      <button data-m="presente" data-id="${k.id}" class="btn act ${s==='presente'?'on-p':''}" ${lock?'disabled':''}>${lock?'🔒':ic('check',18)} Presente</button>
      <button data-m="assente" data-id="${k.id}" class="btn act ${s==='assente'?'on-a':''}" ${lock?'disabled':''}>${ic('x',18)} Assente</button>
      ${S.admin?`<button data-m="barrato" data-id="${k.id}" class="btn act" style="flex:1.25;${s==='barrato'?'background:#64748b;border-color:#64748b;color:#fff':''}">${ic('ban',17)} ${s==='barrato'?'Ripristina':'Non ci sarà'}</button>`:''}
     </div></article>`}).join('');
}
function summary(){
  const l=dayKids(),d=parse(S.date),by=x=>l.filter(k=>st(k)===x).map(k=>`• ${k.nome}${S.view==='all'?' ('+k.sport+')':''}`).join('\n')||'—';
  const c=counts(l),n=l.length-c.p-c.a-c.b;
  return `🏅 *Polisportiva Vico*\n📅 ${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}\n🎯 ${S.view==='all'?'Tutti gli sport':S.view}\n👥 Previsti: ${c.tot} · ✅ ${c.p} · ❌ ${c.a} · 🚫 ${c.b}${n?` · ⏳ da segnare ${n}`:''}\n\n✅ *Presenti (${c.p})*\n${by('presente')}\n\n❌ *Assenti (${c.a})*\n${by('assente')}\n\n🚫 *Assenze preavvisate (${c.b})*\n${by('barrato')}`;
}

/* ---------- STATISTICHE ---------- */
function renderStats(m){
  const byId=Object.fromEntries(S.kids.map(k=>[k.id,k]));
  const sp={},wd={},kid={};let P=0,A=0;
  Object.entries(S.pres).forEach(([key,s])=>{
    if(s==='barrato')return;const i=key.indexOf('_'),date=key.slice(0,i),k=byId[key.slice(i+1)];if(!k)return;
    const w=DAYS[parse(date).getDay()];
    (sp[k.sport]??={p:0,a:0});(wd[w]??={dates:new Set(),p:0});(kid[k.nome]??={p:0,a:0,cl:k.classe,sp:k.sport});
    wd[w].dates.add(date);
    if(s==='presente'){P++;sp[k.sport].p++;wd[w].p++;kid[k.nome].p++}else{A++;sp[k.sport].a++;kid[k.nome].a++}
  });
  const pc=(p,a)=>p+a?Math.round(p/(p+a)*100):0;
  const rows=Object.entries(kid).map(([n,v])=>({n,...v,pc:pc(v.p,v.a)})).sort((a,b)=>b.pc-a.pc||b.p-a.p);
  const sports=Object.keys(SPORT);
  m.innerHTML=`<h2 class="text-2xl font-extrabold mb-1 fade">Statistiche &amp; media presenze</h2><p class="text-sm mb-4" style="color:var(--mute)">Calcolate sulle presenze e assenze segnate (le assenze preavvisate non contano).</p>
  ${P+A?'':`<div class="surf rounded-2xl p-6 text-center mb-4"><div class="text-3xl">📊</div><div class="font-bold">Ancora nessun dato</div><p class="text-sm" style="color:var(--mute)">Fai il primo appello e i grafici compariranno qui.</p></div>`}
  <div class="hero p-5 mb-4"><div class="relative z-10"><div class="text-sm opacity-80">Media presenze complessiva</div><div class="text-5xl font-extrabold">${pc(P,A)}%</div><div class="text-sm opacity-80">${P} presenze · ${A} assenze</div></div></div>
  <div class="surf rounded-2xl p-4 mb-4"><div class="font-bold mb-2">Presenze per sport (%)</div><div style="height:230px"><canvas id="c1"></canvas></div></div>
  <div class="surf rounded-2xl p-4 mb-4"><div class="font-bold mb-2">Affluenza media per giorno (presenti)</div><div style="height:230px"><canvas id="c2"></canvas></div></div>
  <div class="surf rounded-2xl p-4"><div class="font-bold mb-2">Classifica bambini</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr style="color:var(--mute)" class="text-left"><th class="py-1">Bambino</th><th>Sport</th><th>Pres.</th><th>Ass.</th><th>%</th></tr></thead><tbody>${rows.map(r=>`<tr style="border-top:1px solid var(--line)"><td class="py-1.5 font-semibold">${esc(r.n)}</td><td><span class="pill" style="--c:${(SPORT[r.sp]||SPORT['Da assegnare']).c}">${esc(r.sp)}</span></td><td>${r.p}</td><td>${r.a}</td><td class="font-extrabold" style="color:${r.pc>=75?'var(--ok)':r.pc>=50?'#d99a1a':'var(--ko)'}">${r.pc}%</td></tr>`).join('')||`<tr><td colspan="5" class="py-3" style="color:var(--mute)">Nessun dato.</td></tr>`}</tbody></table></div></div>`;
  if(!window.Chart)return;
  const tc=getComputedStyle(document.documentElement).getPropertyValue('--mute'),gc=getComputedStyle(document.documentElement).getPropertyValue('--line');
  const opt={maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc},grid:{display:false}},y:{ticks:{color:tc},grid:{color:gc},beginAtZero:true}}};
  charts.push(new Chart($('#c1'),{type:'bar',data:{labels:sports,datasets:[{data:sports.map(s=>sp[s]?pc(sp[s].p,sp[s].a):0),backgroundColor:sports.map(s=>SPORT[s].c),borderRadius:8}]},options:{...opt,scales:{...opt.scales,y:{...opt.scales.y,max:100}}}}));
  const wl=DAYS.slice(1,6);
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels:wl,datasets:[{data:wl.map(w=>wd[w]?+(wd[w].p/wd[w].dates.size).toFixed(1):0),backgroundColor:'#E8453C',borderRadius:8}]},options:opt}));
}

/* ---------- TABELLONI (ADMIN) ---------- */
function blockColor(t){const x=t.toLowerCase();return x.includes('disponibile')?'free':[['pallavolo','#ec4899'],['basket','#f97316'],['atletica','#06b6d4'],['calcio','#10b981'],['karate','#dc143c'],['pattinaggio','#6366f1'],['mma','#475569'],['prepugilistica','#475569'],['difesa','#7c3aed'],['yoga','#14b8a6'],['ginnastica','#0ea5e9'],['posturale','#84cc16']].find(([k])=>x.includes(k))?.[1]||'#64748b'}
function renderBoard(m){
  const B=DATA[S.bd],days=Object.keys(B);if(!B[S.bday])S.bday=days[0];const t=B[S.bday];
  m.innerHTML=`<h2 class="text-2xl font-extrabold mb-3 fade">🔒 Tabellone palestre</h2>
  <div class="flex gap-2 mb-3"><button data-bd="b2627" class="btn chip rounded-full ${S.bd==='b2627'?'on':''}">Orario 26-27 (Nuovo)</button><button data-bd="orig" class="btn chip rounded-full ${S.bd==='orig'?'on':''}">Orario Originale</button></div>
  <div class="scroll-x flex gap-2 mb-4">${days.map(d=>`<button data-bday="${d}" class="btn chip rounded-full ${S.bday===d?'on':''}">${d}</button>`).join('')}</div>
  <div class="surf rounded-2xl overflow-auto" style="max-height:72vh"><table class="tt w-full border-collapse"><thead><tr><th></th>${t.gyms.map(g=>`<th class="text-left text-xs font-extrabold" style="position:sticky;top:0;background:var(--navy);color:#fff;z-index:3">${esc(g)}</th>`).join('')}</tr></thead><tbody>${t.slots.map(([h,c])=>`<tr><td>${h}</td>${t.gyms.map(g=>{const v=c[g];if(!v)return'<td></td>';const k=blockColor(v);return `<td><div class="blk ${k==='free'?'free':''}" style="--c:${k==='free'?'#22c55e':k}">${esc(v)}</div></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  m.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>{S.bd=b.dataset.bd;render()});
  m.querySelectorAll('[data-bday]').forEach(b=>b.onclick=()=>{S.bday=b.dataset.bday;render()});
}

/* ---------- MODALE BAMBINO (ADMIN) ---------- */
function kidModal(id){
  const k=S.kids.find(x=>x.id===id)||{nome:'',sport:'Da assegnare',classe:'',giorno:dayName()==='Sabato'||dayName()==='Domenica'?'Lunedì':dayName()};
  const M=$('#modal');M.classList.remove('hidden');M.classList.add('flex');
  M.innerHTML=`<div class="surf rounded-3xl p-5 w-full max-w-md fade"><div class="font-extrabold text-lg mb-3">${id?'Modifica bambino':'Aggiungi bambino'}</div>
  <label class="text-xs font-bold">Nome e cognome</label><input id="fN" class="inp mb-2" value="${esc(k.nome)}">
  <div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-xs font-bold">Sport</label><select id="fS" class="inp">${Object.keys(SPORT).map(s=>`<option ${s===k.sport?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label class="text-xs font-bold">Giorno</label><select id="fG" class="inp">${DAYS.slice(1,6).map(s=>`<option ${s===k.giorno?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="grid grid-cols-2 gap-2 mb-4"><div><label class="text-xs font-bold">Classe</label><input id="fC" class="inp" placeholder="es. II - D" value="${esc(k.classe)}"></div><div><label class="text-xs font-bold">Telefono genitore</label><input id="fT" type="tel" class="inp" value="${esc(S.tel[id]||'')}"></div></div>
  <div class="flex gap-2">${id?`<button id="fDel" class="btn p-3 surf" style="color:var(--ko)" aria-label="Elimina">${ic('trash',18)}</button>`:''}<button id="fX" class="btn flex-1 py-3 surf">Annulla</button><button id="fOk" class="btn flex-1 py-3 text-white" style="background:var(--coral)">Salva</button></div></div>`;
  const close=()=>{M.classList.add('hidden');M.classList.remove('flex')};
  $('#fX').onclick=close;M.onclick=e=>{if(e.target===M)close()};
  $('#fOk').onclick=async()=>{
    const nome=$('#fN').value.trim();if(!nome){toast('Inserisci il nome');return}
    const giorno=$('#fG').value,nid=id||kidId(giorno,nome);
    try{await setDoc(doc(db,'bambini',nid),{nome,sport:$('#fS').value,classe:$('#fC').value.trim(),giorno});await setDoc(doc(db,'contatti',nid),{tel:$('#fT').value.trim()});close();toast('Salvato')}catch(e){toast('Errore: '+e.code)}};
  if(id)$('#fDel').onclick=async()=>{if(!confirm('Eliminare '+k.nome+' dal registro? Lo storico presenze resta salvato.'))return;try{await deleteDoc(doc(db,'bambini',id));await deleteDoc(doc(db,'contatti',id));close();toast('Bambino eliminato')}catch(e){toast('Errore: '+e.code)}};
}

/* ---------- EVENTI GLOBALI ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');const menu=$('#menu');
  if(e.target.closest('#menuBtn')){menu.classList.toggle('hidden');return}
  if(!e.target.closest('#menu'))menu.classList.add('hidden');
  if(!t)return;
  if(t.dataset.v){S.view=t.dataset.v;S.flt='tutti';menu.classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(t.dataset.m)mark(t.dataset.id,t.dataset.m);
  else if(t.dataset.edit)kidModal(t.dataset.edit);
  else if(t.id==='addBtn'){menu.classList.add('hidden');kidModal()}
  else if(t.id==='syncBtn'){menu.classList.add('hidden');if(confirm('Sincronizzare i 119 bambini dal file Excel? Nomi, sport, classi e telefoni verranno riallineati al file (le presenze non vengono toccate).'))seed().then(()=>toast('Sincronizzazione completata')).catch(e=>toast('Errore: '+e.code))}
  else if(t.id==='outBtn'){menu.classList.add('hidden');signOut(auth)}
});
</script>
</body>
</html>
