<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4E">
<title>Polisportiva Vico · Registro presenze</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--navy:#1B2A4E;--coral:#E8453C;--bg:#EEF1F8;--surf:#fff;--surf2:#F3F6FB;--ink:#14203D;--mute:#64708C;--line:#DCE2EF;--ok:#10b981;--ko:#f43f5e;--okt:#047857;--kot:#e11d48}
.dark{--navy:#121C3C;--bg:#0B1226;--surf:#141E38;--surf2:#1B2746;--ink:#EAF0FF;--mute:#93A0C0;--line:#26335A;--okt:#34d399;--kot:#fb7185}
*{-webkit-tap-highlight-color:transparent}html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:background .2s,color .2s}
.surf{background:var(--surf);border:1px solid var(--line)}
.navy{background:radial-gradient(130% 160% at 0% 0%,color-mix(in srgb,var(--navy) 88%,#000) 0%,var(--navy) 55%);color:#fff}
.btn{transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s,box-shadow .16s;border-radius:.8rem;font-weight:700}.btn:active{transform:scale(.94)}.btn:hover{filter:brightness(1.04)}
.tbtn{width:2.5rem;height:2.5rem;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .5rem;border-radius:999px;font-size:.68rem;font-weight:700;background:color-mix(in srgb,var(--c) 16%,var(--surf));color:color-mix(in srgb,var(--c) 70%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pill-n{--c:#64748b}
#band{position:relative;overflow:hidden}
#band:before{content:"";position:absolute;right:-70px;top:-80px;width:200px;height:200px;border-radius:99px;border:28px solid var(--coral);opacity:.22;pointer-events:none}
#band:after{content:"";position:absolute;left:-60px;bottom:-90px;width:170px;height:170px;border-radius:99px;background:var(--coral);opacity:.08;pointer-events:none}
.pb{background:rgba(255,255,255,.16);color:#fff;padding:.45rem .9rem;font-size:.82rem;border-radius:999px;font-weight:700;backdrop-filter:blur(6px)}
.content{position:relative;background:var(--bg);border-radius:1.75rem 1.75rem 0 0;margin-top:-1.5rem;padding:1.1rem 1rem 8rem;min-height:70vh;box-shadow:0 -14px 30px -24px rgba(0,0,0,.35)}
.dy{flex:none;width:3.5rem;text-align:center;color:#fff;padding:.2rem 0}
.dy .l{display:block;font-size:.78rem;font-weight:700;opacity:.8}
.dy .n{position:relative;width:2.9rem;height:2.9rem;border-radius:99px;display:grid;place-items:center;margin:.25rem auto 0;font-weight:800;font-size:1.2rem;transition:all .2s}
.dy.we{opacity:.5}.dy.on{opacity:1}.dy.on .n{background:#fff;color:var(--navy);box-shadow:0 8px 20px -6px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.12)}.dy.on .l{opacity:1}
.dy:active .n{transform:scale(.9)}
.dy.td:not(.on) .n{box-shadow:inset 0 0 0 2px var(--coral)}
.tile{border-radius:1rem;padding:.6rem .2rem;text-align:center;background:color-mix(in srgb,var(--t) 13%,var(--surf));transition:transform .18s}
.tile b{display:block;font-size:1.55rem;line-height:1.1;font-weight:800;color:color-mix(in srgb,var(--t) 85%,var(--ink))}.tile span{font-size:.68rem;font-weight:700;color:var(--mute)}
.pbar{height:.65rem;border-radius:99px;background:var(--surf2);border:1px solid var(--line);overflow:hidden;display:flex;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.pbar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.kid{border-radius:1.1rem;border-left:4px solid var(--line);padding:.65rem .75rem;transition:background .2s,border-color .2s,transform .18s,box-shadow .2s;animation:ci .35s cubic-bezier(.2,.8,.2,1) both}
.kid:active{transform:scale(.985)}
.kid.presente{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surf));box-shadow:0 8px 20px -16px var(--ok)}
.kid.assente{border-left-color:var(--ko);background:color-mix(in srgb,var(--ko) 7%,var(--surf));box-shadow:0 8px 20px -16px var(--ko)}
.kid.barrato{border-left-color:#94a3b8;background:var(--surf2);opacity:.7}
@keyframes ci{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nm{font-weight:800;font-size:1rem;line-height:1.15;transition:color .2s}.nm.presente{color:var(--okt)}.nm.assente{color:var(--kot)}
.kid.barrato .nm{text-decoration:line-through;text-decoration-thickness:2px}
.av{width:2.7rem;height:2.7rem;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));flex:none;box-shadow:0 4px 10px -4px color-mix(in srgb,var(--c) 70%,transparent)}
.tb{width:2.9rem;height:2.9rem;border-radius:.9rem;display:grid;place-items:center;background:var(--surf2);border:1.5px solid var(--line);color:var(--mute);flex:none;transition:all .16s}.tb:active{transform:scale(.9)}.tb:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.tb.on-p{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 8px 16px -6px var(--ok)}
.tb.on-a{background:var(--ko);border-color:var(--ko);color:#fff;box-shadow:0 8px 16px -6px var(--ko)}
.badge{width:2.2rem;height:2.2rem;border-radius:99px;display:grid;place-items:center;flex:none;background:var(--surf2);color:var(--mute);border:1.5px dashed var(--line)}
.badge.p{background:var(--ok);color:#fff;border:0;box-shadow:0 6px 14px -6px var(--ok)}.badge.a{background:var(--ko);color:#fff;border:0;box-shadow:0 6px 14px -6px var(--ko)}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,color-mix(in srgb,var(--line) 60%,var(--surf2)) 37%,var(--surf2) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:1.1rem}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.sm{height:2.5rem;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:.35rem;background:var(--surf2);border:1px solid var(--line)}
.chip{white-space:nowrap;padding:.45rem .9rem;font-size:.8rem;border:1px solid var(--line);background:var(--surf);color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 14px -8px var(--navy)}.dark .chip.on{background:var(--coral);border-color:var(--coral);box-shadow:0 6px 14px -8px var(--coral)}
.menu{position:absolute;right:0;top:115%;width:18rem;max-height:78vh;overflow-y:auto;border-radius:1.1rem;padding:.4rem;z-index:60;box-shadow:0 24px 48px -16px rgba(10,20,50,.45);color:var(--ink);backdrop-filter:blur(14px);background:color-mix(in srgb,var(--surf) 92%,transparent)}
.mi{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.65rem .75rem;border-radius:.75rem;font-weight:600;font-size:.9rem;transition:background .15s}.mi:hover,.mi.on{background:var(--surf2)}.mi:active{transform:scale(.98)}
.mh{padding:.5rem .75rem .2rem;font-size:.72rem;font-weight:700;color:var(--mute);letter-spacing:.02em;text-transform:uppercase}
.inp{font-size:16px;width:100%;padding:.7rem .9rem;border-radius:.85rem;background:var(--surf2);border:1.5px solid var(--line);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}.inp:focus{border-color:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 18%,transparent)}
.toast{position:fixed;left:50%;bottom:5.6rem;transform:translate(-50%,30px) scale(.96);opacity:0;background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:600;font-size:.88rem;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:100;pointer-events:none;max-width:92vw;border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 30px -12px rgba(0,0,0,.4)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.blk{background:color-mix(in srgb,var(--c) 20%,var(--surf));border-left:4px solid var(--c);border-radius:.5rem;padding:.35rem .5rem;font-size:.74rem;font-weight:700;line-height:1.2}
.tt th,.tt td{padding:.25rem;border-bottom:1px solid var(--line);min-width:7.2rem;vertical-align:top}.tt th:first-child,.tt td:first-child{position:sticky;left:0;background:var(--surf);min-width:3.4rem;z-index:2;font-weight:700;color:var(--mute);font-size:.75rem}
.fade{animation:fd .45s ease both}@keyframes fd{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.loginbg{background:var(--navy);overflow:hidden}.loginbg:before{content:"";position:absolute;width:520px;height:520px;border-radius:999px;border:70px solid var(--coral);opacity:.35;right:-200px;top:-180px}
.scroll-x{overflow-x:auto;scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
#allp:not(.hidden){animation:pu 2.2s ease-in-out infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 0%,transparent)}}
.tile b{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tile b.bump{animation:bp .38s cubic-bezier(.2,.8,.2,1)}
@keyframes bp{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
#watermark{position:fixed;right:-4.5rem;bottom:-4.5rem;width:16rem;height:16rem;opacity:.05;pointer-events:none;z-index:0;filter:grayscale(1) brightness(1.6)}
.dark #watermark{opacity:.07}
#main{will-change:opacity}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Telefoni stretti: tutto resta leggibile e comodo da toccare, senza tagli o sovrapposizioni */
@media(max-width:380px){
  .tile b{font-size:1.28rem}
  .tile span{font-size:.62rem}
  .tile{padding:.5rem .1rem}
  .kid{padding:.6rem .6rem}
  .av{width:2.4rem;height:2.4rem;font-size:.8rem}
  .nm{font-size:.92rem}
  .pill{font-size:.68rem}
  .tb{width:2.65rem;height:2.65rem}
  #band .max-w-3xl{padding-left:.85rem;padding-right:.85rem}
  .content{padding-left:.85rem;padding-right:.85rem}
}
@media(max-width:340px){
  .tile b{font-size:1.1rem}
  .av{width:2.2rem;height:2.2rem;font-size:.74rem}
}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
</style>
</head>
<body class="min-h-screen" style="padding-top:env(safe-area-inset-top);background:var(--navy)">
<img id="watermark" data-logo alt="" aria-hidden="true">
<input id="dpick" type="date" style="position:fixed;top:9rem;left:50%;width:1px;height:1px;opacity:0;pointer-events:none">

<!-- LOGIN (facoltativo) -->
<section id="login" class="loginbg fixed inset-0 z-[80] hidden items-center justify-center p-5 overflow-y-auto">
  <button id="lClose" class="btn absolute top-4 right-4 z-20 px-4 py-2 text-sm text-white" style="background:rgba(255,255,255,.16)">Continua senza accedere</button>
  <div class="surf relative z-10 w-full max-w-sm rounded-3xl p-7 fade" style="box-shadow:0 30px 60px -20px rgba(0,0,0,.5)">
    <img data-logo alt="CSM Vico 4" class="w-36 mx-auto rounded-2xl" style="background:#fff">
    <h1 class="text-2xl font-extrabold text-center mt-3">Accedi</h1>
    <p class="text-center text-sm mb-5" style="color:var(--mute)">Per segnare le presenze serve un account abilitato.</p>
    <button id="gBtn" class="btn w-full py-3 flex items-center justify-center gap-2 surf"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Accedi con Google</button>
    <div class="flex items-center gap-3 my-4 text-xs" style="color:var(--mute)"><i class="flex-1 h-px" style="background:var(--line)"></i>oppure<i class="flex-1 h-px" style="background:var(--line)"></i></div>
    <input id="lEmail" type="email" autocomplete="email" placeholder="Email" class="inp mb-2">
    <input id="lPass" type="password" autocomplete="current-password" placeholder="Password (min. 6 caratteri)" class="inp mb-3">
    <p id="lErr" class="text-sm mb-2 hidden" style="color:var(--coral)"></p>
    <div class="flex gap-2"><button id="lIn" class="btn flex-1 py-3 text-white" style="background:var(--coral)">Accedi</button><button id="lReg" class="btn flex-1 py-3 surf">Crea account</button></div>
  </div>
</section>

<!-- APP -->
<header id="top" class="navy sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center gap-2.5">
    <img data-logo alt="CSM Vico 4" class="h-10 w-10 rounded-full object-contain p-0.5" style="background:#fff">
    <div class="min-w-0 flex-1"><div class="font-extrabold leading-tight truncate">Polisportiva Vico</div><div class="text-xs" style="opacity:.7">Registro presenze</div></div>
    <span id="roleBadge"></span>
    <button id="accBtn" class="btn"></button>
    <div class="relative"><button id="menuBtn" class="tbtn" aria-label="Menu"></button><div id="menu" class="menu surf hidden"></div></div>
  </div>
</header>
<section id="band" class="navy"></section>
<main id="main" class="content"></main>
<div id="fab" class="fixed bottom-0 inset-x-0 z-40 hidden" style="padding-bottom:calc(env(safe-area-inset-bottom) + .7rem);background:linear-gradient(transparent,var(--bg) 45%)"><div class="max-w-3xl mx-auto px-4 pt-7 flex gap-2"><button id="wa" class="btn flex-1 py-3.5 text-white flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#2bb857,#1f9d4a);box-shadow:0 10px 22px -10px #1f9d4a"></button><button id="cp" class="btn px-4 surf" aria-label="Copia riepilogo"></button></div></div>
<div id="modal" class="fixed inset-0 z-[90] hidden items-end sm:items-center justify-center p-3" style="background:rgba(8,14,34,.6)"></div>

/* Crossfade affidabile e controllato (niente View Transitions API: su contenuti di altezza
   variabile generava artefatti grafici — card che sfumavano a metà schermo). Sfuma solo
   l'opacità del contenitore, senza mai toccare lo scroll o fare snapshot delle dimensioni. */
function vt(fn){
  if(reduceMotion()){fn();return}
  const els=[$('#band'),$('#main')].filter(Boolean);
  if(!els.length){fn();return}
  els.forEach(el=>{el.style.transition='opacity .13s ease';el.style.opacity='0'});
  setTimeout(()=>{
    fn();
    requestAnimationFrame(()=>{els.forEach(el=>{el.style.opacity='1'})});
  },130);
}

}

function counts(l){const c={tot:l.length,p:0,a:0,b:0};l.forEach(k=>{const s=st(k);if(s==='presente')c.p++;else if(s==='assente')c.a++;else if(s==='barrato')c.b++});return c}

const stripRange=(a,b)=>{let h='';for(let d=a;d<=b;d=addDays(d,1))h+=dyH(d);return h};
function buildStrip(){const c=parse(S.date);S.sFrom=addDays(c,-40);S.sTo=addDays(c,40);$('#strip').innerHTML=stripRange(S.sFrom,S.sTo);centerStrip(false)}

/* ---------- STATISTICHE ---------- */
function renderStats(m){
  const byId=Object.fromEntries(expanded().map(k=>[k.id,k]));
  const sp={},wd={},kid={};let P=0,A=0;
  Object.entries(S.pres).forEach(([key,s])=>{
    if(s==='barrato')return;const date=key.slice(0,10),k=byId[key.slice(11)];if(!k)return;
    const w=DAYS[parse(date).getDay()];
    (sp[k.sport]??={p:0,a:0});(wd[w]??={dates:new Set(),p:0});(kid[k.nome]??={p:0,a:0,sp:k.sport});
    wd[w].dates.add(date);
    if(s==='presente'){P++;sp[k.sport].p++;wd[w].p++;kid[k.nome].p++}else{A++;sp[k.sport].a++;kid[k.nome].a++}
  });
  const pc=(p,a)=>p+a?Math.round(p/(p+a)*100):0;
  const rows=Object.entries(kid).map(([n,v])=>({n,...v,pc:pc(v.p,v.a)})).sort((a,b)=>b.pc-a.pc||b.p-a.p);
  const sports=Object.keys(SPORT);
  m.innerHTML=`<div class="max-w-3xl mx-auto"><h2 class="text-2xl font-extrabold mb-1">Statistiche &amp; media presenze</h2><p class="text-sm mb-4" style="color:var(--mute)">Calcolate su presenze e assenze segnate (le assenze preavvisate non contano).</p>
  ${P+A?'':`<div class="surf rounded-2xl p-6 text-center mb-4"><div class="mb-2 flex justify-center" style="color:var(--mute)">${ic('chart',30)}</div><div class="font-bold">Ancora nessun dato</div><p class="text-sm" style="color:var(--mute)">Fai il primo appello e i grafici compariranno qui.</p></div>`}
  <div class="navy rounded-3xl p-5 mb-4"><div class="text-sm opacity-80">Media presenze complessiva</div><div class="text-5xl font-extrabold">${pc(P,A)}%</div><div class="text-sm opacity-80">${P} presenze · ${A} assenze</div></div>
  <div class="surf rounded-2xl p-4 mb-4"><div class="font-bold mb-2">Presenze per sport (%)</div><div style="height:230px"><canvas id="c1"></canvas></div></div>
  <div class="surf rounded-2xl p-4 mb-4"><div class="font-bold mb-2">Affluenza media per giorno (presenti)</div><div style="height:230px"><canvas id="c2"></canvas></div></div>
  <div class="surf rounded-2xl p-4"><div class="font-bold mb-2">Classifica bambini</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr style="color:var(--mute)" class="text-left"><th class="py-1">Bambino</th><th>Sport</th><th>Pres.</th><th>Ass.</th><th>%</th></tr></thead><tbody>${rows.map(r=>`<tr style="border-top:1px solid var(--line)"><td class="py-1.5 font-semibold">${esc(r.n)}</td><td><span class="pill" style="--c:${(SPORT[r.sp]||SPORT[DOPO]).c}">${esc(r.sp)}</span></td><td>${r.p}</td><td>${r.a}</td><td class="font-extrabold" style="color:${r.pc>=75?'var(--okt)':r.pc>=50?'#d99a1a':'var(--kot)'}">${r.pc}%</td></tr>`).join('')||`<tr><td colspan="5" class="py-3" style="color:var(--mute)">Nessun dato.</td></tr>`}</tbody></table></div></div></div>`;
  if(!window.Chart)return;
  const cs=getComputedStyle(document.documentElement),tc=cs.getPropertyValue('--mute'),gc=cs.getPropertyValue('--line');
  const opt={maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc},grid:{display:false}},y:{ticks:{color:tc},grid:{color:gc},beginAtZero:true}}};
  charts.push(new Chart($('#c1'),{type:'bar',data:{labels:sports,datasets:[{data:sports.map(s=>sp[s]?pc(sp[s].p,sp[s].a):0),backgroundColor:sports.map(s=>SPORT[s].c),borderRadius:8}]},options:{...opt,scales:{...opt.scales,y:{...opt.scales.y,max:100}}}}));
  const wl=DAYS.slice(1,6);
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels:wl,datasets:[{data:wl.map(w=>wd[w]?+(wd[w].p/wd[w].dates.size).toFixed(1):0),backgroundColor:'#E8453C',borderRadius:8}]},options:opt}));
}

/* ---------- TABELLONI (ADMIN) ---------- */
function blockColor(t){const x=t.toLowerCase();return x.includes('disponibile')?'#22c55e':[['pallavolo','#ec4899'],['basket','#f97316'],['atletica','#06b6d4'],['calcio','#10b981'],['karate','#dc143c'],['pattinaggio','#6366f1'],['mma','#475569'],['prepugilistica','#475569'],['difesa','#7c3aed'],['yoga','#14b8a6'],['ginnastica','#0ea5e9'],['posturale','#84cc16']].find(([k])=>x.includes(k))?.[1]||'#64748b'}
function renderBoard(m){
  const B=DATA[S.bd],days=Object.keys(B);if(!B[S.bday])S.bday=days[0];const t=B[S.bday];
  m.innerHTML=`<div class="max-w-3xl mx-auto"><h2 class="text-2xl font-extrabold mb-3 flex items-center gap-2">${ic('lock',22)} Tabellone palestre</h2>
  <div class="flex gap-2 mb-3"><button data-bd="b2627" class="btn chip rounded-full ${S.bd==='b2627'?'on':''}">Orario 26-27 (Nuovo)</button><button data-bd="orig" class="btn chip rounded-full ${S.bd==='orig'?'on':''}">Orario Originale</button></div>
  <div class="scroll-x flex gap-2 mb-4">${days.map(d=>`<button data-bday="${d}" class="btn chip rounded-full ${S.bday===d?'on':''}">${d}</button>`).join('')}</div>
  <div class="surf rounded-2xl overflow-auto" style="max-height:72vh"><table class="tt w-full border-collapse"><thead><tr><th></th>${t.gyms.map(g=>`<th class="text-left text-xs font-extrabold" style="position:sticky;top:0;background:var(--navy);color:#fff;z-index:3">${esc(g)}</th>`).join('')}</tr></thead><tbody>${t.slots.map(([h,c])=>`<tr><td>${h}</td>${t.gyms.map(g=>{const v=c[g];return v?`<td><div class="blk" style="--c:${blockColor(v)}">${esc(v)}</div></td>`:'<td></td>'}).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  m.querySelectorAll('[data-bd]').forEach(b=>b.onclick=()=>{S.bd=b.dataset.bd;render()});
  m.querySelectorAll('[data-bday]').forEach(b=>b.onclick=()=>{S.bday=b.dataset.bday;render()});
}

/* ---------- MODALI ADMIN ---------- */
const M=$('#modal');
const openM=k=>{M.dataset.k=k;M.classList.remove('hidden');M.classList.add('flex')};
const closeM=()=>{M.dataset.k='';M.classList.add('hidden');M.classList.remove('flex')};
M.onclick=e=>{if(e.target===M)closeM()};
function kidModal(id){
  const k=S.kids.find(x=>x.id===id)||{nome:'',sport:DOPO,classe:'',giorno:isWE()?'Lunedì':dayName(),nota:''};
  openM('kid');
  M.innerHTML=`<div class="surf rounded-3xl p-5 w-full max-w-md fade"><div class="font-extrabold text-lg mb-3">${id?'Modifica bambino':'Aggiungi bambino'}</div>
  <label class="text-xs font-bold">Nome e cognome</label><input id="fN" class="inp mb-2" value="${esc(k.nome)}">
  <div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-xs font-bold">Sport</label><select id="fS" class="inp">${Object.keys(SPORT).map(s=>`<option ${s===k.sport?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label class="text-xs font-bold">Giorno</label><select id="fG" class="inp">${DAYS.slice(1,6).map(s=>`<option ${s===k.giorno?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-xs font-bold">Classe</label><input id="fC" class="inp" placeholder="es. II - D" value="${esc(k.classe)}"></div><div><label class="text-xs font-bold">Telefono genitore</label><input id="fT" type="tel" class="inp" value="${esc(S.tel[id]||'')}"></div></div>
  <label class="text-xs font-bold">Nota (visibile a tutti, solo l'Admin la modifica)</label><input id="fN2" class="inp mb-4" placeholder="es. allergie, uscita anticipata…" value="${esc(k.nota||'')}">
  <div class="flex gap-2">${id?`<button id="fDel" class="btn p-3 surf" style="color:var(--kot)" aria-label="Elimina">${ic('trash',18)}</button>`:''}<button id="fX" class="btn flex-1 py-3 surf">Annulla</button><button id="fOk" class="btn flex-1 py-3 text-white" style="background:var(--coral)">Salva</button></div></div>`;
  $('#fX').onclick=closeM;
  $('#fOk').onclick=async()=>{const nome=$('#fN').value.trim();if(!nome){toast('Inserisci il nome');return}
    const giorno=$('#fG').value,nid=id||kidId(giorno,nome);
    try{await setDoc(doc(db,'bambini',nid),{nome,sport:$('#fS').value,classe:$('#fC').value.trim(),giorno,nota:$('#fN2').value.trim()});await setDoc(doc(db,'contatti',nid),{tel:$('#fT').value.trim()});closeM();toast('Salvato')}catch(e){toast('Errore: '+e.code)}};
  if(id)$('#fDel').onclick=async()=>{if(!confirm('Eliminare '+k.nome+' dal registro? Lo storico presenze resta salvato.'))return;try{await deleteDoc(doc(db,'bambini',id));await deleteDoc(doc(db,'contatti',id));closeM();toast('Bambino eliminato')}catch(e){toast('Errore: '+e.code)}};
}
/* ---------- EVENTI ---------- */
document.addEventListener('click',async e=>{
  const menu=$('#menu');
  if(e.target.closest('#menuBtn')||(e.target.closest('#accBtn')&&S.user)){menu.classList.toggle('hidden');return}
  if(!e.target.closest('#menu'))menu.classList.add('hidden');
  const t=e.target.closest('button,a');if(!t)return;
  const hide=()=>menu.classList.add('hidden'),a=t.dataset.act;
  if(t.classList.contains('dy')){vt(()=>setDate(t.dataset.d));return}
  if(t.id==='today'){vt(()=>setDate(TODAY()));return}
  if(t.id==='wa'){window.open('https://wa.me/?text='+encodeURIComponent(summary()),'_blank');return}
  if(t.id==='cp'){try{await navigator.clipboard.writeText(summary());toast('Riepilogo copiato negli appunti')}catch(x){toast('Copia non riuscita')}return}
  if(t.dataset.v){S.view=t.dataset.v;S.flt='tutti';hide();vt(()=>render());window.scrollTo({top:0,behavior:'smooth'})}
  else if(t.dataset.f){S.flt=t.dataset.f;vt(()=>refresh())}
  else if(t.dataset.m)mark(t.dataset.id,t.dataset.m);
  else if(t.dataset.edit)kidModal(t.dataset.edit);
  else if(a){hide();
    if(a==='login')openLogin();
    else if(a==='out')signOut(auth);
    else if(a==='date')openPicker();
    else if(a==='theme'){setDark(!isDark());renderMenu()}
    else if(a==='allp')markAll();
    else if(a==='add')kidModal();
    else if(a==='gofri'||a==='gomon'){const x=parse(S.date),w=x.getDay();setDate(iso(addDays(x,a==='gofri'?(w===6?-1:-2):(w===6?2:1))))}
    else if(a==='sync'&&confirm('Sincronizzare i bambini dal file Excel? Nomi, sport, classi e telefoni verranno riallineati al file (le presenze non vengono toccate).'))seed().then(()=>toast('Sincronizzazione completata')).catch(x=>toast('Errore: '+x.code));
  }
});
render();

</script>
</body>
</html>
